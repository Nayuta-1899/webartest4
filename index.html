<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model-Viewer 実装サンプル</title>
    
    <!-- model-viewerライブラリの読み込み (Google公式CDN) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        /* model-viewerのサイズ設定 */
        model-viewer {
            width: 100%;
            height: 100%;
        }
                
        /* AR起動ボタンのカスタムデザイン（任意） */
        #ar-button {
            background: #2563eb;
            color: white;
            border-radius: 4px;
            border: none;
            padding: 12px 24px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* ARモード中に非表示にするためのクラス */
        model-viewer[ar-status="session-started"] #ar-button {
            display: none;

    </style>
</head>
<body>

    <model-viewer 
        src="assets/RSPtoku_webar_model.glb" 
        ios-src="assets/RSPtoku_webar_model.usdz"
        alt="産業機械の3Dモデル" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        exposure="1">

        <!-- このボタンを押すとカメラが起動します -->
    <button slot="ar-button" style="background: #2563eb; color: red; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
        ARカメラを起動する
    </button>
        
        <!-- カスタムAR起動ボタン -->
        <button slot="ar-button" id="ar-button">
            原寸大ARで表示する
        </button>

    </model-viewer>

</body>
</html>
